version: '3'

volumes:
  mysql-data:

services:
  web-backend:
    build: ./config/backend
    container_name: web-backend
    ports:
      - "8080:80"
    volumes:
      - D:/Code/php-tranning:/var/www/html
      - D:/Code/php-tranning/config/backend/php.ini:/usr/local/etc/php/php.ini
      - D:/Code/php-tranning/config/httpd_security.conf:/etc/apache2/conf-available/security.conf
    working_dir: /var/www/html
    restart: always
    depends_on:
      - web-mysql
      - web-redis   # redis 

  web-mysql:
    container_name: web-mysql
    image: mysql:5.7.43
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_web1
      MYSQL_ALLOW_EMPTY_PASSWORD: 1

  web-phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: web-mysql
      MYSQL_ROOT_PASSWORD: root

  web-redis:
    container_name: web-redis
    image: redis:6.2
    ports:
      - "6379:6379"
