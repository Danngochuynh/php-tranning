; Xdebug
xdebug.mode=debug
xdebug.start_with_request=yes
xdebug.discover_client_host=1
xdebug.log=/tmp/xdebug.log
xdebug.client_port = 9003
xdebug.idekey = "PHPSTORM"

; Opcache
opcache.enable = On

; JIT
opcache.jit_buffer_size=128M
opcache.jit=1254

; Tắt thông tin PHP version trong header
expose_php = off

; Tăng giới hạn upload
upload_max_filesize = 5M
post_max_size = 12M

; ==========================
; Session Redis config
; ==========================
; dùng redis thay cho file session mặc định
session.save_handler = redis
session.save_path = "tcp://web-redis:6379"

; session timeout (giây)
session.gc_maxlifetime = 3600
